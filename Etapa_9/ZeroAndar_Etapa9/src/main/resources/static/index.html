<!DOCTYPE html>
<!--
    UC15 - Projeto Integrador 3 - Etapa 9
    @author Alex
    @since 15 de agosto de 2026
    @version 1.9
    Pagina inicial: apenas redireciona para a tela de login.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=login.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroAndar</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #F5F5F5;
            color: #303030;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .redirect-message {
            text-align: center;
            padding: 40px 50px;
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .redirect-message p {
            font-size: 18px;
            color: #5C5C5C;
            margin-bottom: 12px;
        }

        .redirect-message a {
            color: #15AE5C;
            font-weight: 600;
            text-decoration: none;
            font-size: 16px;
        }

        .redirect-message a:hover {
            text-decoration: underline;
        }

        .spinner {
            margin: 24px auto 0;
            width: 40px;
            height: 40px;
            border: 4px solid #E0E0E0;
            border-top-color: #15AE5C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <p>Redirecionando para a tela de login...</p>
        <p><a href="login.html">Clique aqui se não for redirecionado automaticamente</a></p>
        <div class="spinner"></div>
    </div>
    <script src="js/api.js"></script>
</body>
</html>
