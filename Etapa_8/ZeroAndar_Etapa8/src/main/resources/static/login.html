<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroAndar - Sistema de Prospecção Imobiliária</title>

    <!-- Bootstrap (usado para o modal de "em construção" em outras telas e reset base) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS unificado do login -->
    <link rel="stylesheet" href="css/style-login.css">
</head>

<body class="login-page">

    <!-- HEADER -->
    <div class="header">
        <div class="logo-box">
            <img src="images/Logotipo.png" alt="Logotipo ZeroAndar" class="logo-img">
        </div>

        <div class="user-menu">
            <div class="user-icon">👤</div>
            <div class="user-info">
                <div class="user-name">Nome do Usuário</div>
                <div class="user-role">Cargo</div>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div class="login-wrapper">
        <h1 class="login-title">Seja bem-vindo(a)</h1>

        <form class="login-form" id="loginForm" novalidate>
            <input type="email" id="email" class="input-field" placeholder="Email ID" autocomplete="username">
            <input type="password" id="senha" class="input-field" placeholder="Senha" autocomplete="current-password">

            <label class="remember-me">
                <input type="checkbox" id="lembrarMe" name="lembrarMe">
                Lembrar-me !
            </label>

            <div class="login-error" id="loginErro"></div>

            <button type="submit" class="btn-login">LOGIN</button>

            <a href="#" id="linkEsqueceuSenha" class="forgot-password">Esqueceu a Senha?</a>
        </form>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>&copy; 2026 <strong>ZERO ANDAR</strong>. Todos os direitos autorais reservados. É proibida a distribuição parcial ou total sem autorização.</p>
    </div>

    <!-- Scripts: jQuery, Bootstrap e logica da tela -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
